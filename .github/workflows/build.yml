name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install and add Android
        run: |
          npm install
          npx cap add android

      - name: App icon
        run: |
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            convert icon-512.png -resize ${2}x${2} $RES/mipmap-$1/ic_launcher.png
            convert icon-512.png -resize ${2}x${2} $RES/mipmap-$1/ic_launcher_round.png
            convert icon-maskable-512.png -resize ${3}x${3} $RES/mipmap-$1/ic_launcher_foreground.png
          done
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0F9D6B</color></resources>' > $RES/values/ic_launcher_background.xml
          mkdir -p $RES/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
            echo '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>' > $RES/mipmap-anydpi-v26/$n.xml
          done

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fuel-invoices-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
